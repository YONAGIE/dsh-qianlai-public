name: Zhangjie business acceptance 180–187

on:
  push:
    branches: [validation/zhangjie-business-180-187]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Full suites
        shell: bash
        run: |
          pnpm --filter @moneycome/fintax-core exec vitest run --testTimeout 20000
          pnpm --filter dsh-qianlai exec vitest run --testTimeout 20000
      - run: node packages/dsh-qianlai/e2e/check-accounting-flow.mjs
      - name: Real DSH installation and start with synthetic data
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 4
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/qianlai-dsh" --no-save --no-audit --no-fund '@deepseek-ai/dsh@0.2.2-rc.1'
          node packages/dsh-qianlai/scripts/check-dsh-wechat.mjs "$RUNNER_TEMP/qianlai-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
